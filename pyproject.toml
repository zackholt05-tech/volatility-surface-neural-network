[project]
name = "volsurf"
version = "0.1.0"
description = "Arbitrage-aware neural implied-volatility surfaces for SPX options, with mispricing detection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Zackary Holt", email = "zackholt05@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "torch>=2.4",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "py7zr>=1.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volsurf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
