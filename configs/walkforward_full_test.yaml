# The full-history SPX conditional model and its quarterly refits on the test year (2023), frozen
# before the run: 10 epochs per refit (chosen on 2022, configs/walkforward_spx_full.yaml), the Phase
# 6 protocol and sampling of configs/walkforward_test.yaml, and the 2018-base refits on the same
# days (cond_wf, which must reproduce walkforward-test). This is the third look at SPX 2023, after
# the Phase 7 mispricing tests and walkforward-test; it was run because the full-history refits
# beat the 2018-base refits on 2022, amortized and refined.
experiment: walkforward-full-test
workers: 8

sources:
  spx: [2023]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

models:
  - {name: cond_wf, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt"}}
  - {name: cond_wf_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt", refine_iters: 100}}
  - {name: cond_full, model: conditional, params: {checkpoint: artifacts/conditional/spx_full_d8.pt}}
  - {name: cond_full_refined, model: conditional, params: {checkpoint: artifacts/conditional/spx_full_d8.pt, refine_iters: 100}}
  - {name: cond_full_wf, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_full_e10_{quarter}.pt"}}
  - {name: cond_full_wf_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_full_e10_{quarter}.pt", refine_iters: 100}}
