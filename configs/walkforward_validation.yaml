# Walk-forward refits of the SPX conditional model on the validation year (2022), under the Phase 6
# protocol (same sampled days, holdouts and screening as phase6-final, whose cond rows the first two
# models must reproduce). cond_wf<E> scores each day with the refit for its quarter after E epochs
# (configs/walkforward_spx.yaml); E is chosen here by the lowest mean amortized fit RMSE.
experiment: walkforward-validation
workers: 8

sources:
  spx: [2022]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

models:
  - {name: cond, model: conditional, params: {checkpoint: artifacts/conditional/spx_d8.pt}}
  - {name: cond_refined, model: conditional, params: {checkpoint: artifacts/conditional/spx_d8.pt, refine_iters: 100}}
  - {name: cond_wf10, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e10_{quarter}.pt"}}
  - {name: cond_wf20, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e20_{quarter}.pt"}}
  - {name: cond_wf40, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt"}}
  - {name: cond_wf10_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e10_{quarter}.pt", refine_iters: 100}}
  - {name: cond_wf20_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e20_{quarter}.pt", refine_iters: 100}}
  - {name: cond_wf40_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt", refine_iters: 100}}
