# Phase 5 final: the hard-constrained eSSVI family under the full Phase 3 protocol (validation years
# only). mix4 (four free-knot eSSVI surfaces mixed in price space) is the headline model; nmix4 is
# the same mixture with knots generated by a network of maturity, and nmix1 / essvi pair the two
# generators on a single surface. ssvi and svi are deterministic anchors: sampled days, holdouts and
# screening match phase4-final and phase4-clean, so their rows must reproduce those experiments and
# the Phase 4 models can be compared without refitting (scripts/compare_results.py).
experiment: phase5-final
workers: 8

sources:
  spx: [2022]
  synthetic:heston: [2021]
  synthetic:ssvi: [2021]
  synthetic:heston_clean: [2021]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

net: &net {generator: mlp, hidden: [64, 64, 64], lbfgs_iters: 1000, warm_lbfgs_iters: 1000}

models:
  - {name: ssvi, model: ssvi}
  - {name: svi, model: svi}
  - {name: essvi, model: essvi}
  - {name: nmix1, model: nessvi, warm_start: true, params: {<<: *net, components: 1}}
  - {name: mix4, model: nessvi, warm_start: true, params: {components: 4, generator: free, init_scales: [1.0, 1.8, 0.6, 1.3]}}
  - {name: nmix4, model: nessvi, warm_start: true, params: {<<: *net, components: 4, init_scales: [1.0, 1.8, 0.6, 1.3]}}
