# configs/replication_mispricing.yaml on refitted surfaces: each day's least-squares mix4 surface
# is the better of the default start and a fit from the previous day's chosen surface
# (scripts/fit_panel.py --warm-start; see configs/phase7_warm.yaml for why). Every other setting is
# unchanged. This is a second look at SPX 2016-2017.
#   make replication-warm
experiment: replication-warm
robust: {passes: 2, scale: 1.0, lbfgs_iters: 100, refine_iters: 100}  # Phase 7 (iv_rob)
variants:
  seg: {pool: 2, scale: 0.25, passes: 16}  # Phase 7b

detection:
  margins: [0.0, 0.5, 1.0, 2.0, 4.0, 6.0]

reversion:
  horizons: [1, 3, 5]

panels:
  spx:
    test: [2016, 2017]
    detectors: [iv_rob, iv_seg, iv_ls]
    backtest:  # configs/phase7.yaml
      margin: 4.0
      exit_r: 0.5
      hold: 5
      lags: [1, 0]
      fee: 1.0
      target_vega: 1000.0
      max_gap: 3
      min_dte: 7
      z_range: [-6.0, 4.0]
      placebo_draws: 20
