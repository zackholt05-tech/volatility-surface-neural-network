# Phase 7: mispricing detection, reversion tests and the delta-hedged backtest. Everything below was
# chosen on the validation years (SPX 2022, synthetic Heston 2021) before the test years were run:
#   make mispricing-validation   # fits and reports the validation years
#   make mispricing-test         # the test years, once, with this file unchanged
robust:  # Cauchy IRLS refits of each day's mix4 surface (src/volsurf/eval/mispricing.py)
  passes: 2
  scale: 1.0          # half-spreads; c = 2 absorbed 1.5 times as much of point mispricings on Heston 2021
  lbfgs_iters: 100    # per refit; 300 gave the same truth error
  refine_iters: 100   # latent refinement of the conditional detector (synthetic panels)

detection:
  margins: [0.0, 0.5, 1.0, 2.0, 4.0, 6.0]  # reported grid, half-spreads outside the bid-ask

reversion:
  horizons: [1, 3, 5]

panels:
  spx:
    validation: 2022
    test: 2023
    detectors: [iv_rob, iv_ls]  # the first is traded
    backtest:
      # selected on SPX 2022 by net Sharpe with next-day execution over margin {2, 4, 6} x
      # hold {1, 5} (exit at |r| < 0.5): margin 4, hold 5 was the only one not losing net
      margin: 4.0
      exit_r: 0.5
      hold: 5
      lags: [1, 0]    # next-day execution (main), and at the signal's close (optimistic bound)
      fee: 1.0        # dollars per contract per side
      target_vega: 1000.0
      max_gap: 3
      min_dte: 7
      z_range: [-6.0, 4.0]  # configs/data_spx.yaml filters
      placebo_draws: 20
  synthetic:heston:
    validation: 2021
    test: 2022
    checkpoint: artifacts/conditional/heston_d8.pt
    detectors: [iv_cond, iv_rob, iv_ls]  # the conditional model had the best precision and recall
    backtest:
      margin: 0.5     # precision 0.96 / recall 0.64 for the conditional detector on Heston 2021
      exit_r: 0.5
      hold: 5
      lags: [1, 0]
      fee: 1.0
      target_vega: 1000.0
      max_gap: 3
      min_dte: 7
      z_range: [-4.0, 2.5]  # configs/synthetic.yaml listing band
      placebo_draws: 20
