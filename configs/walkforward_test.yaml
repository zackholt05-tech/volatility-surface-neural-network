# Walk-forward refits of the SPX conditional model on the test year (2023), frozen before the run:
# 40 epochs per quarterly refit (chosen on 2022, configs/walkforward_spx.yaml), the Phase 6 protocol
# and sampling, and mix4 and the Phase 6 conditional model on the same days. SPX 2023 was used
# once before, in Phase 7, for mispricing reversion and the backtest; no surface-fit metric of any
# model had been computed on it.
experiment: walkforward-test
workers: 8

sources:
  spx: [2023]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

models:
  - {name: mix4, model: nessvi, warm_start: true, params: {components: 4, generator: free, init_scales: [1.0, 1.8, 0.6, 1.3]}}
  - {name: cond, model: conditional, params: {checkpoint: artifacts/conditional/spx_d8.pt}}
  - {name: cond_refined, model: conditional, params: {checkpoint: artifacts/conditional/spx_d8.pt, refine_iters: 100}}
  - {name: cond_wf, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt"}}
  - {name: cond_wf_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_e40_{quarter}.pt", refine_iters: 100}}
