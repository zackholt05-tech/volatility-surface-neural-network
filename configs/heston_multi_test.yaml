# The multi-year synthetic conditional model against the Phase 6 one and mix4 on the synthetic test
# panels, under the Phase 6 protocol, frozen before the run. Heston 2022 was used once before, in
# Phase 7 (detection only); heston_fresh (a new seed, dated 2023) has not been seen at all.
experiment: heston-multi-test
workers: 8

sources:
  synthetic:heston: [2022]
  synthetic:heston_fresh: [2023]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

models:
  - {name: mix4, model: nessvi, warm_start: true, params: {components: 4, generator: free, init_scales: [1.0, 1.8, 0.6, 1.3]}}
  - {name: cond, model: conditional, params: {checkpoint: artifacts/conditional/heston_d8.pt}}
  - {name: cond_refined, model: conditional, params: {checkpoint: artifacts/conditional/heston_d8.pt, refine_iters: 100}}
  - {name: cond_multi, model: conditional, params: {checkpoint: artifacts/conditional/heston_multi_d8.pt}}
  - {name: cond_multi_refined, model: conditional, params: {checkpoint: artifacts/conditional/heston_multi_d8.pt, refine_iters: 100}}
