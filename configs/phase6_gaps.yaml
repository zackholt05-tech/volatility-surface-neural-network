# Phase 6 gap-filling: the same protocol with more of each chain held out. Every level is its own
# experiment (`make gaps` sets eval.holdout per level), and every model is refitted on the sparser
# chains; held-out interior quotes, including whole held-out maturities, are scored as `interp`.
experiment: phase6-gaps
workers: 8

sources:
  spx: [2022]
  synthetic:heston: [2021]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10, slice_frac: 0.0}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

models:
  - {name: ssvi, model: ssvi}
  - {name: svi, model: svi}
  - {name: mix4, model: nessvi, warm_start: true, params: {components: 4, generator: free, init_scales: [1.0, 1.8, 0.6, 1.3]}}
  - {name: cond, model: conditional, params: {checkpoint: "artifacts/conditional/{panel}_d8.pt"}}
  - {name: cond_refined, model: conditional, params: {checkpoint: "artifacts/conditional/{panel}_d8.pt", refine_iters: 100}}
