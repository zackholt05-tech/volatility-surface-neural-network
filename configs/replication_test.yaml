# Replication on SPX 2016-2017: every surface model with the settings chosen on SPX 2022, under the
# Phase 3-6 protocol (sampling, screening, holdouts, arbitrage grid), run once with this file
# unchanged. No 2010-2017 day was looked at before it was frozen. The per-day models are exactly
# those of phases 4 and 5; the conditional models are the Phase 6 model and its quarterly refits,
# retrained on 2010 to Sep 2015 (configs/replication_train_spx.yaml, walkforward_replication.yaml).
#   make replication
experiment: replication-test
workers: 8

sources:
  spx: [2016, 2017]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7, material_vol: 1.0e-4}
  resid_floor: 0.001

pnn: &pnn  # configs/phase4_final.yaml
  hidden: [64, 64, 64]
  activation: tanh
  prior: ssvi
  features: k_theta
  time_feature: log
  steps: 500
  lbfgs_iters: 2000
  warm_steps: 100
  warm_lbfgs_iters: 1000
  collocation: {n_T: 20, n_k: 41, widen: 1.0, T_extend: [0.8, 1.25], midpoints: true}
  penalty: {calendar: 100, butterfly: 100, wing: 100}

models:
  - {name: ssvi, model: ssvi}
  - {name: svi, model: svi}
  - {name: spline, model: spline, params: {smooth: 1.0}}
  - {name: pnn, model: mlp, warm_start: true, params: *pnn}
  - {name: mix4, model: nessvi, warm_start: true, params: {components: 4, generator: free, init_scales: [1.0, 1.8, 0.6, 1.3]}}
  - {name: cond, model: conditional, params: {checkpoint: artifacts/conditional/spx_rep_d8.pt}}
  - {name: cond_refined, model: conditional, params: {checkpoint: artifacts/conditional/spx_rep_d8.pt, refine_iters: 100}}
  - {name: cond_wf, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_rep_e40_{quarter}.pt"}}
  - {name: cond_wf_refined, model: conditional, params: {checkpoint: "artifacts/conditional/walkforward/spx_rep_e40_{quarter}.pt", refine_iters: 100}}
