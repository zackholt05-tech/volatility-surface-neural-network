# Phase 3: classical and neural baselines under the shared evaluation protocol.
# Model selection uses the validation years only; test years stay untouched until models freeze.
experiment: phase3-baselines
workers: 6

sources:                       # source -> evaluation years
  spx: [2022]                  # real data: train 2018-2021, val 2022, test 2023
  synthetic:heston: [2021]     # synthetic panels: train 2020, val 2021, test 2022
  synthetic:ssvi: [2021]

eval:
  sampling: {every: 10, block: 2}
  screen: {max_arb_butterfly: 0.10, min_forward_valid: 0.8, drop_flagged_quotes: true}
  holdout: {wing_frac: 0.1, interior_frac: 0.15, min_slice: 10}
  arbitrage: {n_T: 40, n_k: 101, n_k_cal: 801, widen: 0.5, tol_g: 1.0e-5, tol_cal: 1.0e-7}
  resid_floor: 0.001

models:
  - {name: ssvi, model: ssvi}
  - {name: svi, model: svi}
  - {name: spline, model: spline, params: {smooth: 1.0}}
  - name: mlp
    model: mlp
    params: {hidden: [64, 64, 64], activation: softplus, prior: none, steps: 500, lbfgs_iters: 500}
